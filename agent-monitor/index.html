<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏢 Agent 監控工作室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap');

  :root {
    --floor: #d4a96a;
    --wall: #7a9e9f;
    --wall-light: #a8c5c6;
    --desk: #8b5e3c;
    --desk-top: #a0714f;
    --chair: #4a6fa5;
    --screen: #1a1a2e;
    --screen-on: #00ff88;
    --pixel: 2px;
    --room-w: 900px;
    --room-h: 520px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'DotGothic16', monospace;
    overflow-x: hidden;
  }

  /* ─── Header ─── */
  .header {
    width: 100%;
    text-align: center;
    padding: 18px 0 10px;
    color: #00ff88;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #00ff88aa;
  }
  .header small {
    display: block;
    font-size: 8px;
    color: #7ec8e3;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* ─── Clock ─── */
  .clock {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #ffd700;
    text-shadow: 0 0 8px #ffd700aa;
    margin-bottom: 12px;
  }

  /* ─── Room ─── */
  .room-wrap {
    position: relative;
    width: var(--room-w);
    max-width: 98vw;
  }

  .room {
    position: relative;
    width: 100%;
    height: var(--room-h);
    background: var(--wall);
    border: 4px solid #4a6060;
    border-bottom: none;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* wall texture lines */
  .room::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      transparent, transparent 39px,
      rgba(0,0,0,0.07) 39px, rgba(0,0,0,0.07) 40px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 39px,
      rgba(0,0,0,0.04) 39px, rgba(0,0,0,0.04) 40px
    );
  }

  /* wall highlight */
  .room::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.06), transparent);
    pointer-events: none;
  }

  /* Floor */
  .floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 130px;
    background: repeating-linear-gradient(
      90deg,
      var(--floor) 0px, var(--floor) 59px,
      #c4954a 59px, #c4954a 60px
    );
    border-top: 4px solid #b07840;
  }
  .floor::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      transparent, transparent 59px,
      rgba(0,0,0,0.08) 59px, rgba(0,0,0,0.08) 60px
    );
  }

  /* Baseboard */
  .baseboard {
    position: absolute;
    bottom: 126px; left: 0; right: 0;
    height: 8px;
    background: #5a7a7b;
    border-bottom: 2px solid #3a5a5b;
  }

  /* Window */
  .window {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 90px;
    background: linear-gradient(135deg, #87ceeb 0%, #b0e0ff 40%, #87ceeb 100%);
    border: 6px solid #5a7a7b;
    border-radius: 4px;
    overflow: hidden;
  }
  .window::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, transparent 47%, rgba(0,0,0,0.2) 47%, rgba(0,0,0,0.2) 53%, transparent 53%),
      linear-gradient(transparent 47%, rgba(0,0,0,0.2) 47%, rgba(0,0,0,0.2) 53%, transparent 53%);
  }
  .window .cloud {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: cloudMove 8s linear infinite;
  }
  .window .cloud-a { width: 30px; height: 14px; top: 20px; left: -30px; animation-duration: 9s; }
  .window .cloud-b { width: 20px; height: 10px; top: 40px; left: -20px; animation-duration: 12s; animation-delay: -4s; }
  @keyframes cloudMove {
    to { left: 130px; }
  }

  /* ─── Furniture ─── */

  /* Desks */
  .desk {
    position: absolute;
    bottom: 130px;
    image-rendering: pixelated;
  }
  .desk-surface {
    height: 18px;
    background: var(--desk-top);
    border: 3px solid #7a4e2c;
    border-radius: 3px 3px 0 0;
    position: relative;
    z-index: 5;
  }
  .desk-body {
    height: 40px;
    background: var(--desk);
    border: 3px solid #7a4e2c;
    border-top: none;
    display: flex;
    justify-content: space-between;
    padding: 4px 6px;
  }
  .desk-leg {
    width: 10px;
    background: #6b4a30;
    border: 2px solid #5a3a20;
    align-self: flex-end;
    height: 100%;
  }

  /* Monitor */
  .monitor {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .monitor-screen {
    width: 52px;
    height: 36px;
    background: var(--screen);
    border: 3px solid #333;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .monitor-screen.on {
    background: #0d1f2d;
    box-shadow: 0 0 8px #00ff8844;
  }
  .monitor-screen.on::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      transparent, transparent 3px,
      rgba(0,255,100,0.04) 3px, rgba(0,255,100,0.04) 4px
    );
  }
  .screen-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 4px;
  }
  .screen-bar {
    height: 3px;
    background: #00ff88;
    border-radius: 1px;
    animation: screenFlicker 2s steps(1) infinite;
  }
  .screen-bar:nth-child(2) { width: 70%; animation-delay: 0.3s; }
  .screen-bar:nth-child(3) { width: 85%; animation-delay: 0.7s; }
  .screen-bar:nth-child(4) { width: 55%; animation-delay: 1.1s; }
  @keyframes screenFlicker {
    0%, 90% { opacity: 1; }
    95% { opacity: 0.3; }
    100% { opacity: 1; }
  }
  .monitor-stand {
    width: 6px;
    height: 10px;
    background: #555;
    border: 1px solid #333;
  }
  .monitor-base {
    width: 22px;
    height: 5px;
    background: #444;
    border: 1px solid #333;
    border-radius: 2px;
  }

  /* Chair */
  .chair {
    position: absolute;
    bottom: 100px;
  }
  .chair-back {
    width: 34px;
    height: 32px;
    background: var(--chair);
    border: 3px solid #2a4f85;
    border-radius: 3px 3px 0 0;
    position: relative;
    z-index: 2;
  }
  .chair-seat {
    width: 38px;
    height: 10px;
    background: #3a5f95;
    border: 3px solid #2a4f85;
    margin-left: -2px;
    border-radius: 2px;
    position: relative;
    z-index: 2;
  }
  .chair-leg {
    width: 3px;
    height: 18px;
    background: #666;
    border: 1px solid #444;
    position: absolute;
    bottom: -18px;
  }

  /* Coffee machine */
  .coffee-machine {
    position: absolute;
    bottom: 148px;
    right: 60px;
    width: 46px;
  }
  .cm-body {
    width: 46px;
    height: 60px;
    background: #c0392b;
    border: 3px solid #922b21;
    border-radius: 4px 4px 0 0;
    position: relative;
  }
  .cm-panel {
    position: absolute;
    top: 8px; left: 6px; right: 6px;
    height: 24px;
    background: #1a1a1a;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .cm-btn {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #e74c3c;
    box-shadow: 0 0 4px #e74c3caa;
  }
  .cm-btn.active { background: #00ff88; box-shadow: 0 0 6px #00ff88aa; animation: btnBlink 1s steps(1) infinite; }
  @keyframes btnBlink { 50% { opacity: 0.4; } }
  .cm-spout {
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 10px;
    background: #666;
    border: 1px solid #444;
  }
  .cm-base {
    width: 46px;
    height: 12px;
    background: #922b21;
    border: 3px solid #7b241c;
    border-top: none;
  }
  .cm-cup {
    position: absolute;
    bottom: -18px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 12px;
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 0 0 3px 3px;
  }
  .cm-steam {
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
  }
  .steam-line {
    width: 2px;
    height: 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 1px;
    animation: steamRise 1.5s ease-in infinite;
  }
  .steam-line:nth-child(2) { animation-delay: 0.5s; }
  @keyframes steamRise {
    0% { transform: translateY(0) scaleY(1); opacity: 0.6; }
    100% { transform: translateY(-12px) scaleY(0); opacity: 0; }
  }

  /* Plant */
  .plant {
    position: absolute;
    bottom: 130px;
    left: 30px;
  }
  .plant-pot {
    width: 22px;
    height: 18px;
    background: #b05030;
    border: 2px solid #8a3a20;
    border-radius: 0 0 4px 4px;
    clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
  }
  .plant-leaves {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0;
  }
  .leaf {
    width: 14px; height: 18px;
    background: #2d8a4e;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    border: 1px solid #1d6a3e;
  }
  .leaf:first-child { transform: rotate(-30deg) translateX(4px); }
  .leaf:last-child { transform: rotate(30deg) translateX(-4px); }
  .leaf:nth-child(2) { transform: translateY(-6px); background: #3aaa60; }

  /* Whiteboard */
  .whiteboard {
    position: absolute;
    top: 50px;
    left: 30px;
    width: 100px;
    height: 70px;
    background: #f5f5f0;
    border: 4px solid #8b5e3c;
    border-radius: 3px;
  }
  .wb-content {
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .wb-line {
    height: 3px;
    background: #c0392b;
    border-radius: 1px;
  }
  .wb-line:nth-child(2) { width: 70%; background: #2980b9; }
  .wb-line:nth-child(3) { width: 85%; background: #27ae60; }
  .wb-text {
    font-size: 7px;
    color: #333;
    font-family: monospace;
    margin-top: 2px;
  }

  /* ─── Character ─── */
  .character {
    position: absolute;
    bottom: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: left 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    z-index: 20;
    user-select: none;
  }

  /* Name tag */
  .name-tag {
    font-size: 8px;
    color: white;
    background: rgba(0,0,0,0.7);
    padding: 2px 5px;
    border-radius: 3px;
    white-space: nowrap;
    margin-bottom: 3px;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* Status bubble */
  .status-bubble {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 2px solid #333;
    border-radius: 8px;
    padding: 2px 5px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 30;
    animation: bubblePop 0.3s ease-out;
  }
  .status-bubble::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: #333;
  }
  @keyframes bubblePop {
    from { transform: translateX(-50%) scale(0.5); opacity: 0; }
    to { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  /* Pixel character body */
  .char-sprite {
    position: relative;
    image-rendering: pixelated;
  }

  .char-head {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    border: 2px solid rgba(0,0,0,0.3);
    position: relative;
    margin: 0 auto;
  }
  .char-eye {
    position: absolute;
    width: 4px; height: 4px;
    background: #333;
    border-radius: 1px;
    top: 7px;
  }
  .char-eye.left { left: 3px; }
  .char-eye.right { right: 3px; }
  .char-mouth {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 3px;
    border-radius: 0 0 3px 3px;
    background: #555;
  }

  /* sleeping eyes */
  .char-eye.sleeping {
    height: 2px;
    background: #333;
    border-radius: 0;
    top: 8px;
  }

  /* Body */
  .char-body {
    width: 24px;
    height: 22px;
    border-radius: 3px;
    border: 2px solid rgba(0,0,0,0.3);
    margin: 1px auto 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .char-body-icon {
    font-size: 10px;
    line-height: 1;
  }

  /* Arms */
  .char-arms {
    position: absolute;
    width: 40px;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: space-between;
  }
  .char-arm {
    width: 8px; height: 14px;
    border-radius: 3px;
    border: 2px solid rgba(0,0,0,0.2);
  }
  .char-arm.left { border-radius: 3px 0 0 3px; }
  .char-arm.right { border-radius: 0 3px 3px 0; }

  /* Legs */
  .char-legs {
    display: flex;
    gap: 2px;
    margin: 1px auto 0;
    width: 22px;
  }
  .char-leg-limb {
    width: 9px; height: 16px;
    border-radius: 0 0 3px 3px;
    border: 2px solid rgba(0,0,0,0.2);
  }

  /* Working state animations */
  .character.working .char-arm.left {
    animation: typingL 0.3s ease-in-out infinite alternate;
    transform-origin: top center;
  }
  .character.working .char-arm.right {
    animation: typingR 0.3s ease-in-out infinite alternate;
    transform-origin: top center;
  }
  @keyframes typingL { from { transform: rotate(-10deg); } to { transform: rotate(15deg); } }
  @keyframes typingR { from { transform: rotate(10deg); } to { transform: rotate(-15deg); } }

  /* Walking animation */
  .character.walking .char-leg-limb:first-child {
    animation: walkL 0.4s ease-in-out infinite alternate;
    transform-origin: top center;
  }
  .character.walking .char-leg-limb:last-child {
    animation: walkR 0.4s ease-in-out infinite alternate;
    transform-origin: top center;
  }
  @keyframes walkL { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }
  @keyframes walkR { from { transform: rotate(20deg); } to { transform: rotate(-20deg); } }

  /* Idle bounce */
  .character.idle .char-sprite {
    animation: idleBob 2s ease-in-out infinite;
  }
  @keyframes idleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* Sleeping */
  .character.sleeping {
    filter: brightness(0.85);
  }
  .character.sleeping .char-sprite {
    animation: sleepTilt 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes sleepTilt {
    0%, 100% { transform: rotate(0deg); }
    40% { transform: rotate(-8deg); }
    60% { transform: rotate(-8deg); }
  }
  .zzz {
    position: absolute;
    top: -30px;
    right: -8px;
    font-size: 11px;
    color: #7ec8e3;
    animation: zzzFloat 2s ease-in infinite;
    font-family: 'Press Start 2P', monospace;
  }
  .zzz:nth-child(2) { font-size: 8px; top: -42px; right: -2px; animation-delay: 0.7s; }
  @keyframes zzzFloat {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-12px); opacity: 0; }
  }

  /* flip direction */
  .character.facing-left .char-sprite { transform: scaleX(-1); }

  /* ─── Legend / Status Panel ─── */
  .panel-wrap {
    width: var(--room-w);
    max-width: 98vw;
    background: #0d1f2d;
    border: 3px solid #00ff8855;
    border-top: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
  }

  .agent-card {
    flex: 1 1 150px;
    padding: 10px 14px;
    border-right: 1px solid #1a3a4a;
    border-bottom: 1px solid #1a3a4a;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
  }
  .agent-card:hover { background: #1a2f3f; }
  .agent-card.active-card { background: #0d2f1f; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .card-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .card-name {
    font-size: 9px;
    color: #e0e0e0;
    font-family: 'Press Start 2P', monospace;
    line-height: 1.3;
  }
  .card-status {
    font-size: 9px;
    color: #7ec8e3;
    margin-top: 2px;
  }
  .card-task {
    font-size: 8px;
    color: #aaa;
    margin-top: 3px;
    min-height: 12px;
  }
  .status-indicator {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 14px;
  }

  /* ─── Footer ─── */
  .footer {
    font-size: 8px;
    color: #456;
    padding: 8px;
    font-family: 'Press Start 2P', monospace;
  }

  /* ─── Notification toast ─── */
  .toast-container {
    position: fixed;
    top: 20px; right: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 999;
  }
  .toast {
    background: #0d2f1f;
    border: 2px solid #00ff88;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 9px;
    color: #00ff88;
    font-family: 'Press Start 2P', monospace;
    animation: toastIn 0.3s ease-out, toastOut 0.4s ease-in 2.6s forwards;
    max-width: 240px;
  }
  @keyframes toastIn { from { transform: translateX(260px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toastOut { to { transform: translateX(260px); opacity: 0; } }

  /* ─── Responsive ─── */
  @media (max-width: 920px) {
    :root { --room-w: 98vw; --room-h: 400px; }
    .agent-card { flex: 1 1 130px; }
  }
</style>
</head>
<body>

<div class="header">
  🏢 AGENT 監控工作室
  <small>即時 AI 助手狀態監控系統 · Click 角色或卡片切換狀態</small>
</div>
<div class="clock" id="clock">00:00:00</div>

<div class="room-wrap">
  <div class="room" id="room">

    <!-- Decorations -->
    <div class="window">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
    </div>

    <div class="whiteboard">
      <div class="wb-content">
        <div class="wb-line"></div>
        <div class="wb-line"></div>
        <div class="wb-line"></div>
        <div class="wb-text">SPRINT 42</div>
      </div>
    </div>

    <div class="plant">
      <div class="plant-leaves">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
      </div>
      <div class="plant-pot"></div>
    </div>

    <div class="coffee-machine">
      <div class="cm-body">
        <div class="cm-panel">
          <div class="cm-btn active"></div>
          <div class="cm-btn"></div>
          <div class="cm-btn"></div>
        </div>
        <div class="cm-spout">
          <div class="cm-steam">
            <div class="steam-line"></div>
            <div class="steam-line"></div>
          </div>
        </div>
      </div>
      <div class="cm-base"></div>
      <div class="cm-cup"></div>
    </div>

    <!-- Desks will be injected by JS -->
    <!-- Characters will be injected by JS -->

    <div class="floor"></div>
    <div class="baseboard"></div>
  </div>

  <!-- Status Panel -->
  <div class="panel-wrap" id="panel"></div>
</div>

<div class="footer">↑ 點擊小人或卡片可切換工作/休息狀態 · 小人會自動在房間裡移動</div>

<div class="toast-container" id="toasts"></div>

<script>
// ─── Agent definitions ───
const AGENTS = [
  {
    id: 'claude',
    name: 'Claude',
    role: '全能助手',
    icon: '🧠',
    color: '#e8956d',
    skinColor: '#f5c5a3',

// ─── State ───
const state = {
  agents: AGENTS.map(a => ({
    ...a,
    status: Math.random() > 0.4 ? 'idle' : 'working',
    currentTask: '',
    x: 0,
    walking: false,
    facingLeft: false,
    targetX: 0,
    moveTimer: null,
    bubbleTimer: null,
    taskTimer: null,
  })),
};

// ─── Layout constants ───
const ROOM_W = () => document.getElementById('room').clientWidth;
const DESK_Y_OFFSET = 58; // desk height from floor
const CHAR_Y = 0;

// Desk positions (left %)
function getDeskPositions(count, roomW) {
  const margin = 60;
  const spacing = (roomW - margin * 2) / count;
  return Array.from({ length: count }, (_, i) => margin + spacing * i + spacing * 0.5 - 55);
}

// ─── Build HTML ───
function buildRoom() {
  const room = document.getElementById('room');
  const roomW = room.clientWidth;
  const deskPositions = getDeskPositions(AGENTS.length, roomW);

  // Desks
  AGENTS.forEach((agent, i) => {
    const desk = document.createElement('div');
    desk.className = 'desk';
    desk.id = `desk-${agent.id}`;
    desk.style.left = deskPositions[i] + 'px';
    desk.style.width = '90px';
    desk.innerHTML = `
      <div class="monitor" style="left:50%;">
        <div class="monitor-screen ${agent.status === 'working' ? 'on' : ''}" id="screen-${agent.id}">
          <div class="screen-content">
            <div class="screen-bar"></div>
            <div class="screen-bar"></div>
            <div class="screen-bar"></div>
            <div class="screen-bar"></div>
          </div>
        </div>
        <div class="monitor-stand"></div>
        <div class="monitor-base"></div>
      </div>
      <div class="desk-surface"></div>
      <div class="desk-body">
        <div class="desk-leg"></div>
        <div class="desk-leg"></div>
      </div>
      <div class="chair" style="left: 12px;">
        <div class="chair-back"></div>
        <div class="chair-seat">
          <div class="chair-leg" style="left:4px;"></div>
          <div class="chair-leg" style="right:4px;"></div>
        </div>
      </div>
    `;
    room.insertBefore(desk, room.querySelector('.floor'));

    // Set initial character x to desk position
    state.agents[i].x = deskPositions[i] + 25;
    state.agents[i].targetX = state.agents[i].x;
  });

  // Characters
  AGENTS.forEach((agent, i) => {
    const a = state.agents[i];
    const el = document.createElement('div');
    el.className = `character ${a.status} ${a.status === 'idle' ? 'idle' : ''}`;
    el.id = `char-${agent.id}`;
    el.style.left = a.x + 'px';
    el.title = agent.name;
    el.innerHTML = buildCharHTML(agent, a.status);
    el.addEventListener('click', () => toggleAgent(i));
    room.appendChild(el);
  });
}

function buildCharHTML(agent, status) {
  const sleeping = status === 'sleeping' || status === 'idle';
  const eyeClass = sleeping ? 'char-eye sleeping' : 'char-eye';
  const zzz = sleeping ? `<div class="zzz">z</div><div class="zzz">z</div>` : '';
  return `
    <div class="name-tag">${agent.icon} ${agent.name}</div>
    <div class="char-sprite">
      ${zzz}
      <div class="char-head" style="background:${agent.skinColor}">
        <div class="${eyeClass} left"></div>
        <div class="${eyeClass} right"></div>
        <div class="char-mouth"></div>
      </div>
      <div class="char-body" style="background:${agent.shirtColor}; position:relative;">
        <div class="char-arms">
          <div class="char-arm left" style="background:${agent.skinColor}"></div>
          <div class="char-arm right" style="background:${agent.skinColor}"></div>
        </div>
        <div class="char-body-icon">${agent.icon}</div>
      </div>
      <div class="char-legs">
        <div class="char-leg-limb" style="background:${agent.pantColor}"></div>
        <div class="char-leg-limb" style="background:${agent.pantColor}"></div>
      </div>
    </div>
  `;
}

// ─── Panel ───
function buildPanel() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  state.agents.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = `agent-card ${a.status === 'working' ? 'active-card' : ''}`;
    card.id = `card-${a.id}`;
    const statusLabel = a.status === 'working' ? '工作中' : '休息中';
    const dotColor = a.status === 'working' ? '#00ff88' : '#556677';
    const statusIcon = a.status === 'working' ? '🟢' : '💤';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-dot" style="background:${dotColor}; box-shadow: ${a.status === 'working' ? `0 0 6px ${dotColor}` : 'none'}"></div>
        <div class="card-name">${a.icon}<br>${a.name}</div>
      </div>
      <div class="card-status">${a.role}</div>
      <div class="card-task" id="task-${a.id}">${a.status === 'working' ? (a.currentTask || a.tasks[0]) : '...'}</div>
      <div class="status-indicator">${statusIcon}</div>
    `;
    card.addEventListener('click', () => toggleAgent(i));
    panel.appendChild(card);
  });
}

// ─── Toggle agent status ───
function toggleAgent(i) {
  const a = state.agents[i];
  a.status = a.status === 'working' ? 'idle' : 'working';
  a.currentTask = a.status === 'working' ? a.tasks[Math.floor(Math.random() * a.tasks.length)] : '';

  updateCharacter(i);
  updatePanel(i);
  updateMonitor(i);

  const sayList = a.status === 'working' ? a.workSays : a.idleSays;
  showBubble(i, sayList[Math.floor(Math.random() * sayList.length)]);
  showToast(`${a.icon} ${a.name} 現在${a.status === 'working' ? '開始工作！' : '去休息了～'}`);

  if (a.status === 'working') {
    scheduleMove(i);
  }
}

function updateCharacter(i) {
  const a = state.agents[i];
  const el = document.getElementById(`char-${a.id}`);
  if (!el) return;
  el.className = `character ${a.status} ${a.status === 'idle' ? 'idle' : ''} ${a.facingLeft ? 'facing-left' : ''}`;
  const sprite = el.querySelector('.char-sprite');
  // Rebuild inner to update zzz
  el.innerHTML = buildCharHTML(AGENTS[i], a.status);
  el.addEventListener('click', () => toggleAgent(i));
}

function updatePanel(i) {
  const a = state.agents[i];
  const card = document.getElementById(`card-${a.id}`);
  if (!card) return;
  const dotColor = a.status === 'working' ? '#00ff88' : '#556677';
  card.className = `agent-card ${a.status === 'working' ? 'active-card' : ''}`;
  card.querySelector('.card-dot').style.background = dotColor;
  card.querySelector('.card-dot').style.boxShadow = a.status === 'working' ? `0 0 6px ${dotColor}` : 'none';
  card.querySelector('.card-task').textContent = a.status === 'working' ? (a.currentTask || a.tasks[0]) : '...';
  card.querySelector('.status-indicator').textContent = a.status === 'working' ? '🟢' : '💤';
  card.querySelector('.card-status').textContent = a.role;
}

function updateMonitor(i) {
  const a = state.agents[i];
  const screen = document.getElementById(`screen-${a.id}`);
  if (!screen) return;
  screen.className = `monitor-screen ${a.status === 'working' ? 'on' : ''}`;
}

// ─── Bubble ───
function showBubble(i, text) {
  const a = state.agents[i];
  if (a.bubbleTimer) clearTimeout(a.bubbleTimer);
  const el = document.getElementById(`char-${a.id}`);
  if (!el) return;
  const old = el.querySelector('.status-bubble');
  if (old) old.remove();
  const bubble = document.createElement('div');
  bubble.className = 'status-bubble';
  bubble.textContent = text;
  el.appendChild(bubble);
  a.bubbleTimer = setTimeout(() => bubble.remove(), 2500);
}

// ─── Movement ───
function scheduleMove(i) {
  const a = state.agents[i];
  if (a.status !== 'working') return;
  if (a.moveTimer) clearTimeout(a.moveTimer);
  const delay = 2000 + Math.random() * 4000;
  a.moveTimer = setTimeout(() => moveTo(i), delay);
}

function moveTo(i) {
  const a = state.agents[i];
  if (a.status !== 'working') return;
  const roomW = ROOM_W();

  // Pick a random x or another agent's desk area
  const targets = getDeskPositions(AGENTS.length, roomW);
  const targetIdx = Math.floor(Math.random() * targets.length);
  const newX = targets[targetIdx] + Math.random() * 40;
  const clampedX = Math.min(Math.max(newX, 10), roomW - 50);

  a.facingLeft = clampedX < a.x;
  a.targetX = clampedX;

  const el = document.getElementById(`char-${a.id}`);
  if (el) {
    el.classList.add('walking');
    el.classList.toggle('facing-left', a.facingLeft);
  }

  const duration = Math.abs(clampedX - a.x) * 8 + 400;
  el.style.transition = `left ${Math.min(duration, 2000)}ms cubic-bezier(0.4,0,0.2,1)`;
  el.style.left = clampedX + 'px';
  a.x = clampedX;

  setTimeout(() => {
    if (el) el.classList.remove('walking');
    scheduleMove(i);
  }, Math.min(duration, 2000) + 200);

  // Occasionally say something while walking
  if (Math.random() < 0.4) {
    setTimeout(() => {
      const says = a.status === 'working' ? a.workSays : a.idleSays;
      showBubble(i, says[Math.floor(Math.random() * says.length)]);
    }, 300);
  }
}

// ─── Task ticker ───
function startTaskTicker() {
  setInterval(() => {
    state.agents.forEach((a, i) => {
      if (a.status === 'working') {
        a.currentTask = a.tasks[Math.floor(Math.random() * a.tasks.length)];
        const el = document.getElementById(`task-${a.id}`);
        if (el) el.textContent = a.currentTask;
      }
    });
  }, 3000);
}

// ─── Clock ───
function startClock() {
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('zh-TW', { hour12: false });
  }
  tick();
  setInterval(tick, 1000);
}

// ─── Toast ───
function showToast(msg) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3100);
}

// ─── Random auto events ───
function startAutoEvents() {
  setInterval(() => {
    const working = state.agents.filter(a => a.status === 'working');
    if (working.length > 0 && Math.random() < 0.4) {
      const a = working[Math.floor(Math.random() * working.length)];
      const i = state.agents.indexOf(a);
      showBubble(i, a.workSays[Math.floor(Math.random() * a.workSays.length)]);
    }
    const idle = state.agents.filter(a => a.status === 'idle');
    if (idle.length > 0 && Math.random() < 0.2) {
      const a = idle[Math.floor(Math.random() * idle.length)];
      const i = state.agents.indexOf(a);
      showBubble(i, a.idleSays[Math.floor(Math.random() * a.idleSays.length)]);
    }
  }, 4000);
}

// ─── Init ───
window.addEventListener('load', () => {
  buildRoom();
  buildPanel();

  // Start working agents' movement
  state.agents.forEach((a, i) => {
    if (a.status === 'working') {
      scheduleMove(i);
    }
  });

  startTaskTicker();
  startClock();
  startAutoEvents();

  // Show welcome toast
  setTimeout(() => showToast('🏢 歡迎來到 Agent 監控工作室！'), 600);
  setTimeout(() => showToast('👆 點擊小人切換工作/休息狀態'), 1800);
});
